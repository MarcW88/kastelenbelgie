name: Visual design review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kasteel/gravensteen/**"
      - "content/kasteel/**"
      - "scripts/build.mjs"
      - "content/reviewed-pages.json"
      - "assets/castle-detail.css"
      - "assets/province-guide.css"
      - "assets/styles.css"
      - "scripts/apply-reviewed-pages.mjs"
      - "package.json"
      - "package-lock.json"
      - ".agents/skills/site-design-review/**"
      - ".github/workflows/visual-design-review.yml"
      - "scripts/check-west-flanders.mjs"

jobs:
  visual-gravensteen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build reviewed pages
        run: npm run build
      - name: Validate West Flanders sources and generated routes
        run: node scripts/check-west-flanders.mjs
      - name: Capture Gravensteen desktop and mobile
        run: npm run visual:east-flanders
      - name: Capture West Flanders castle desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          for castle in kasteel-van-loppem kasteel-beauvoorde kasteel-van-rumbeke kasteel-wijnendale kasteel-tillegem kasteel-tudor kasteel-beisbroek kasteel-de-blankaart; do
            node .agents/skills/site-design-review/scripts/run-visual-review.mjs --route "/kasteel/$castle/" --output ".artifacts/design-review/west-flanders/$castle"
          done
      - name: Upload West Flanders visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: west-flanders-design-review
          path: .artifacts/design-review/west-flanders/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: east-flanders-design-review
          path: .artifacts/design-review/east-flanders/
          if-no-files-found: warn
          retention-days: 14
