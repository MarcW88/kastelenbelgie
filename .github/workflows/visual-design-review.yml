name: Visual design review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kasteel/gravensteen/**"
      - "content/kasteel/**"
      - "scripts/build.mjs"
      - "content/reviewed-pages.json"
      - "assets/castle-detail.css"
      - "assets/province-guide.css"
      - "assets/styles.css"
      - "scripts/apply-reviewed-pages.mjs"
      - "package.json"
      - "package-lock.json"
      - ".agents/skills/site-design-review/**"
      - ".github/workflows/visual-design-review.yml"

jobs:
  visual-gravensteen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build reviewed pages
        run: npm run build
      - name: Capture Gravensteen desktop and mobile
        run: npm run visual:east-flanders
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: east-flanders-design-review
          path: .artifacts/design-review/east-flanders/
          if-no-files-found: warn
          retention-days: 14
