name: Verify static site for GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-pages-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate all pages
        run: |
          npm run build
          npm run check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Verify a second build changes nothing
        run: |
          npm run build
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
