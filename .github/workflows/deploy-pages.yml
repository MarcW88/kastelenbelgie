name: Deploy atlas to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm run check
      # Keep checked-in public HTML identical to the verified deployment.
      # Without this, branch-based Pages builds can publish old menu/noindex
      # files while this workflow uploads freshly generated HTML.
      - name: Synchronize built static pages to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- ':(glob)**/index.html' index.html sitemap.xml robots.txt assets/site-version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(site): sync verified generated HTML [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
