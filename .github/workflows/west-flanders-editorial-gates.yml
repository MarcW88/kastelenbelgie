name: West Flanders editorial gates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/kasteel/**"
      - "content/research/kasteel/**"
      - "content/briefs/kasteel/**"
      - "content/reviews/kasteel/**"
      - "scripts/verify-west-editorial-gates.mjs"
      - ".github/workflows/west-flanders-editorial-gates.yml"

permissions:
  contents: read

jobs:
  evidence-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build canonical castle pages
        run: npm run build
      - name: Validate source, metadata and internal links
        run: node scripts/check-west-flanders.mjs
      - name: Run executable editorial machine gates
        run: node scripts/verify-west-editorial-gates.mjs
      - name: Upload complete gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: west-flanders-machine-gates
          path: .artifacts/qa/west-flanders-machine-gates.json
          if-no-files-found: warn
