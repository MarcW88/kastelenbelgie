name: Beloeil desktop-mobile and production audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beloeil-visual-check.yml'
      - 'scripts/check-beloeil-visual.mjs'
      - 'content/kasteel/kasteel-van-beloeil/body.html'
      - 'kasteel/kasteel-van-beloeil/index.html'
jobs:
  beloeil-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/check-beloeil-visual.mjs
      - name: Upload Beloeil desktop and mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beloeil-desktop-mobile
          path: .artifacts/beloeil-visual/
          if-no-files-found: warn
          retention-days: 14
